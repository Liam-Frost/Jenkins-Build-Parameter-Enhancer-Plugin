# Builds and tests on every push and pull request. ci.jenkins.io runs the same build once the repository is hosted
# under jenkinsci; this workflow gives feedback before that and on forks. Pushing a tag such as v1.0.0 also
# attaches the packaged plugin to a GitHub release, so it can be installed before it is in the update center.
name: Build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            java: 21
          - os: ubuntu-latest
            java: 25
          - os: windows-latest
            java: 21
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Package the release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mvn -B -ntp -DskipTests "-Dchangelist=${version}" package
          mv target/*.hpi "target/build-parameter-enhancer-${version}.hpi"
      - uses: softprops/action-gh-release@v2
        with:
          files: target/*.hpi
          generate_release_notes: true
          fail_on_unmatched_files: true
