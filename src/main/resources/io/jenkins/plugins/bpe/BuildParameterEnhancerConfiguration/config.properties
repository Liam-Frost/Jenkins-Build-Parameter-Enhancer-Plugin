enabled.description=When unchecked, every job falls back to the native Build with Parameters page. The system property io.jenkins.plugins.bpe.BuildParameterEnhancerConfiguration.disabled=true does the same without changing configuration.
rules.description=JSON rules used by Auto Generate Layout. Each rule has groupId, title, optional description, collapsed, columns, patterns (case-insensitive globs matched against the whole parameter name), types and onlyTypes (string, text, boolean, choice, password, git, other). The first matching rule wins; parameters matching no rule stay unassigned.
