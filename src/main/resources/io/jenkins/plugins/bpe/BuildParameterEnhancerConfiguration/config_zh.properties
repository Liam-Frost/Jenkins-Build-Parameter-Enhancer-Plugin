Build\ Parameter\ Enhancer=构建参数增强器
Enable\ enhanced\ build\ forms=启用增强的构建表单
Auto\ Generate\ Layout\ rules=自动生成布局规则
enabled.description=取消勾选后，所有任务都回退到 Jenkins 原生的"参数化构建"页面。系统属性 io.jenkins.plugins.bpe.BuildParameterEnhancerConfiguration.disabled=true 也能做到同样的效果，并且不会更改配置。
rules.description=自动生成布局使用的 JSON 规则。每条规则包含 groupId、title、可选的 description、collapsed、columns、patterns (匹配整个参数名称的不区分大小写的 glob 通配符)、types 和 onlyTypes (string、text、boolean、choice、password、git、other)。第一个匹配的规则生效；不匹配任何规则的参数保持未分配。
